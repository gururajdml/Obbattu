plugins { id 'com.android.application' }

def uploadKeystore = System.getenv('OBBATTU_UPLOAD_KEYSTORE_PATH')
def uploadStorePassword = System.getenv('OBBATTU_UPLOAD_STORE_PASSWORD')
def uploadKeyAlias = System.getenv('OBBATTU_UPLOAD_KEY_ALIAS')
def uploadKeyPassword = System.getenv('OBBATTU_UPLOAD_KEY_PASSWORD')
def releaseSigningReady = uploadKeystore && uploadStorePassword && uploadKeyAlias && uploadKeyPassword

android {
    namespace 'in.obbattu.app'
    compileSdk 36
    defaultConfig {
        applicationId 'in.obbattu.app'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }
    if (releaseSigningReady) {
        signingConfigs {
            release {
                storeFile file(uploadKeystore)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
